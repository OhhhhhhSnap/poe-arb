<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POE-ARB — Arbitrage Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #1c2128;
      --border: #30363d; --border-muted: #21262d;
      --gold: #d4a017; --green: #3fb950; --yellow: #d29922; --red: #f85149;
      --text: #e6edf3; --text-sec: #7d8590;
      --mono: 'JetBrains Mono', monospace; --sans: 'Inter', -apple-system, sans-serif;
    }
    html, body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }

    .demo-banner { background: #2d1f00; border-bottom: 1px solid #6e4c00; padding: 0.4rem 1rem; font-family: var(--mono); font-size: 0.7rem; color: #f0a500; text-align: center; }

    /* HEADER */
    .app-header { display: flex; align-items: center; gap: 0.6rem; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.55rem 1rem; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; }
    .app-logo { font-family: var(--mono); font-weight: 700; font-size: 0.95rem; color: var(--gold); letter-spacing: 0.12em; }
    .version-toggle { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .vtoggle { background: none; border: none; color: var(--text-sec); font-family: var(--mono); font-size: 0.7rem; padding: 0.22rem 0.55rem; cursor: pointer; transition: all 0.12s; }
    .vtoggle.active { background: var(--gold); color: #000; font-weight: 700; }
    .league-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 0.75rem; padding: 0.25rem 0.45rem; border-radius: 6px; outline: none; max-width: 160px; }
    .h-spacer { flex: 1; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .header-time { font-family: var(--mono); font-size: 0.68rem; color: var(--text-sec); }

    /* STATS */
    .stats-bar { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
    .stat { flex: 1; padding: 0.5rem 0.4rem; text-align: center; border-right: 1px solid var(--border-muted); }
    .stat:last-child { border-right: none; }
    .stat-label { font-size: 0.58rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.07em; }
    .stat-val { font-family: var(--mono); font-size: 0.88rem; font-weight: 600; margin-top: 0.12rem; }

    /* CATEGORY TABS */
    .cat-nav { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
    .cat-nav::-webkit-scrollbar { display: none; }
    .cat-tab { font-family: var(--mono); font-size: 0.7rem; padding: 0.52rem 0.9rem; border: none; background: none; color: var(--text-sec); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; transition: all 0.12s; flex-shrink: 0; }
    .cat-tab:hover { color: var(--text); }
    .cat-tab.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 600; }
    .cat-tab .cat-count { font-size: 0.6rem; color: var(--text-sec); margin-left: 0.25rem; }
    .cat-tab.active .cat-count { color: var(--gold); opacity: 0.7; }
    .cat-tab.soon { opacity: 0.4; cursor: default; }

    /* FILTER BAR */
    .filter-bar { display: flex; align-items: center; gap: 0.45rem; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.38rem 1rem; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-label { font-size: 0.65rem; color: var(--text-sec); flex-shrink: 0; }
    .chip { font-family: var(--mono); font-size: 0.65rem; padding: 0.18rem 0.5rem; border: 1px solid var(--border); border-radius: 20px; background: none; color: var(--text-sec); cursor: pointer; transition: all 0.12s; flex-shrink: 0; }
    .chip:hover { border-color: var(--gold); color: var(--gold); }
    .chip.active { border-color: var(--gold); color: var(--gold); background: rgba(212,160,23,0.1); }

    /* CALC */
    .calc-panel { background: var(--surface); border-bottom: 1px solid var(--border); }
    .calc-summary { display: flex; align-items: center; gap: 0.45rem; padding: 0.4rem 1rem; cursor: pointer; list-style: none; }
    .calc-summary::-webkit-details-marker { display: none; }
    .calc-caret { font-family: var(--mono); font-size: 0.6rem; color: var(--text-sec); transition: transform 0.15s; }
    details[open] .calc-caret { transform: rotate(90deg); }
    .calc-lbl { font-size: 0.72rem; color: var(--text-sec); }
    .calc-body { padding: 0.45rem 1rem 0.75rem; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .calc-row { display: flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; }
    .calc-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 0.75rem; padding: 0.25rem 0.4rem; border-radius: 6px; width: 88px; outline: none; }
    .calc-input:focus { border-color: var(--gold); }
    .calc-chips { display: flex; flex-wrap: wrap; gap: 0.28rem; flex: 1; }
    .calc-chip { font-family: var(--mono); font-size: 0.65rem; color: var(--green); background: rgba(63,185,80,0.08); border: 1px solid rgba(63,185,80,0.18); border-radius: 4px; padding: 0.12rem 0.38rem; }

    /* LIST */
    .list-wrap { max-width: 860px; margin: 0 auto; }
    .list-header { display: grid; grid-template-columns: 1fr 72px 80px; padding: 0.4rem 1rem; font-size: 0.62rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.07em; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 52px; z-index: 50; }
    .lh-r { text-align: right; }

    .opp-row { border-bottom: 1px solid var(--border-muted); cursor: pointer; }
    .opp-row:hover { background: rgba(255,255,255,0.025); }
    .row-main { display: grid; grid-template-columns: 1fr 72px 80px; align-items: center; padding: 0.6rem 1rem; gap: 0.6rem; }

    .icon-chain { display: flex; align-items: center; gap: 2px; margin-bottom: 0.2rem; flex-wrap: wrap; }
    .cur-img { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; image-rendering: -webkit-optimize-contrast; }
    .cur-fb { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 4px; font-family: var(--mono); font-size: 0.55rem; font-weight: 700; flex-shrink: 0; }
    .chain-sep { color: var(--text-sec); font-size: 0.5rem; padding: 0 1px; }

    .row-sub { font-family: var(--mono); font-size: 0.6rem; color: var(--text-sec); display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }
    .badge-fast { font-size: 0.55rem; color: var(--yellow); border: 1px solid var(--yellow); border-radius: 3px; padding: 0.04rem 0.22rem; }
    .badge-new  { font-size: 0.55rem; color: var(--green);  border: 1px solid var(--green);  border-radius: 3px; padding: 0.04rem 0.22rem; }
    .conf-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .conf-dot.high   { background: var(--green); }
    .conf-dot.medium { background: var(--yellow); }
    .conf-dot.low    { background: var(--red); }

    .row-margin { font-family: var(--mono); font-weight: 700; font-size: 0.9rem; text-align: right; white-space: nowrap; }
    .row-margin.green  { color: var(--green); }
    .row-margin.yellow { color: var(--yellow); }

    .row-profit { font-family: var(--mono); font-size: 0.7rem; color: var(--green); text-align: right; white-space: nowrap; }
    .row-profit small { color: var(--text-sec); font-size: 0.58rem; }

    /* EXPANDED */
    .row-details { display: none; padding: 0.15rem 1rem 0.75rem; background: rgba(0,0,0,0.18); border-top: 1px solid var(--border-muted); }
    .row-details.open { display: block; }
    .det-rates { font-family: var(--mono); font-size: 0.7rem; color: var(--text-sec); line-height: 1.8; margin-bottom: 0.4rem; }
    .det-rates span { color: var(--text); }
    .det-meta { font-family: var(--mono); font-size: 0.63rem; color: var(--text-sec); margin-bottom: 0.55rem; }
    .det-actions { display: flex; gap: 0.45rem; }
    .btn-w { flex: 1; font-family: var(--mono); font-size: 0.7rem; padding: 0.35rem; border-radius: 6px; border: 1px solid var(--gold); color: var(--gold); background: none; cursor: pointer; transition: all 0.12s; }
    .btn-w:hover, .btn-w.copied { background: var(--gold); color: #000; }
    .btn-l { flex: 1; font-family: var(--mono); font-size: 0.7rem; padding: 0.35rem; border-radius: 6px; border: 1px solid var(--border); color: var(--text-sec); background: none; cursor: pointer; transition: all 0.12s; }
    .btn-l:hover { border-color: var(--green); color: var(--green); }

    /* EMPTY / SOON */
    .empty-state { padding: 3rem 1rem; text-align: center; color: var(--text-sec); font-family: var(--mono); font-size: 0.8rem; line-height: 2; }
    .empty-state strong { color: var(--text); display: block; font-size: 0.9rem; margin-bottom: 0.5rem; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: flex-end; justify-content: center; z-index: 500; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px 12px 0 0; padding: 1.4rem; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 0.9rem; }
    .modal-title { font-family: var(--mono); font-weight: 700; color: var(--gold); font-size: 0.88rem; }
    .modal-path { font-family: var(--mono); font-size: 0.72rem; color: var(--text-sec); }
    .modal-label { display: flex; flex-direction: column; gap: 0.28rem; font-size: 0.75rem; color: var(--text-sec); }
    .modal-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 0.85rem; padding: 0.38rem 0.55rem; border-radius: 6px; outline: none; width: 100%; }
    .modal-input:focus { border-color: var(--gold); }
    .modal-input[readonly] { color: var(--text-sec); }
    .modal-actions { display: flex; gap: 0.55rem; justify-content: flex-end; }
    .modal-cancel  { background: none; border: 1px solid var(--border); color: var(--text-sec); font-family: var(--mono); font-size: 0.72rem; padding: 0.38rem 0.85rem; border-radius: 6px; cursor: pointer; }
    .modal-confirm { background: var(--gold); border: 1px solid var(--gold); color: #000; font-family: var(--mono); font-size: 0.72rem; font-weight: 700; padding: 0.38rem 0.85rem; border-radius: 6px; cursor: pointer; }
    .hidden { display: none !important; }

    @media (max-width: 460px) {
      .list-header, .row-main { grid-template-columns: 1fr 68px; }
      .lh-profit, .row-profit { display: none; }
    }
  </style>
</head>
<body>

<div class="demo-banner">⚡ DEMO MODE — mock data · real icons from web.poecdn.com · connect backend for live arb</div>

<header class="app-header">
  <span class="app-logo">POE-ARB</span>
  <div class="version-toggle">
    <button class="vtoggle active" data-ver="poe2">PoE2</button>
    <button class="vtoggle" data-ver="poe1">PoE1</button>
  </div>
  <select class="league-select" id="league-select">
    <option value="poe2">Fate of the Vaal</option>
    <option value="poe2">Standard (PoE2)</option>
    <option value="poe1" disabled>── PoE1 ──</option>
    <option value="poe1">Settlers of Kalguur</option>
    <option value="poe1">Standard (PoE1)</option>
  </select>
  <div class="h-spacer"></div>
  <span class="live-dot"></span>
  <span class="header-time" id="htime">--:--:--</span>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-label">Opps</div><div class="stat-val" id="s-opps">—</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-val" style="color:var(--green)" id="s-best">—</div></div>
  <div class="stat"><div class="stat-label">Session</div><div class="stat-val" id="s-session">+8.2c</div></div>
  <div class="stat"><div class="stat-label">Age</div><div class="stat-val" id="s-age">18s</div></div>
</div>

<nav class="cat-nav" id="cat-nav">
  <button class="cat-tab active" data-cat="currency">Currency <span class="cat-count" id="cnt-currency"></span></button>
  <button class="cat-tab" data-cat="fragment">Fragments <span class="cat-count" id="cnt-fragment"></span></button>
  <button class="cat-tab soon" title="Requires PoE Trade API — coming soon">Scarabs</button>
  <button class="cat-tab soon" title="Requires PoE Trade API — coming soon">Div Cards</button>
  <button class="cat-tab soon" title="Requires PoE Trade API — coming soon">Skill Gems</button>
</nav>

<div class="filter-bar">
  <span class="filter-label">Start:</span>
  <div id="base-chips" style="display:contents"></div>
</div>

<details class="calc-panel">
  <summary class="calc-summary">
    <span class="calc-caret">▶</span>
    <span class="calc-lbl">Profit Calculator</span>
  </summary>
  <div class="calc-body">
    <div class="calc-row">Budget <input id="calc-budget" type="number" value="5000" class="calc-input"> Chaos</div>
    <div class="calc-chips" id="calc-chips"></div>
  </div>
</details>

<div class="list-wrap">
  <div class="list-header">
    <div>Arbitrage Path</div>
    <div class="lh-r">Margin</div>
    <div class="lh-r lh-profit">Profit / Budget</div>
  </div>
  <div id="opp-list"></div>
</div>

<!-- LOG FLIP MODAL -->
<div id="log-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-title">Log Completed Flip</div>
    <div class="modal-path" id="modal-path"></div>
    <label class="modal-label">Expected Profit (c)<input type="number" id="modal-exp" class="modal-input" readonly></label>
    <label class="modal-label">Actual Profit (c)<input type="number" id="modal-act" class="modal-input" step="0.1"></label>
    <div class="modal-actions">
      <button class="modal-cancel" id="modal-cancel">Cancel</button>
      <button class="modal-confirm" id="modal-confirm">Log Flip</button>
    </div>
  </div>
</div>

// ── STATE ──────────────────────────────────────────────────────────────────
let version = 'poe2';
let category = 'currency';
let activeBase = '';
let budget = 5000;

function opps() {
  const all = (DATA[version][category] || []);
  return activeBase ? all.filter(o => o.base === activeBase) : all;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function age(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return Math.floor(s) + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  return Math.floor(s/3600) + 'h ago';
}

function iconEl(name) {
  const url = (ICONS[version] || {})[name];
  const col = FB_COL[name] || '#7d8590';
  const abbr = ABBR[name] || name.slice(0, 3);
  const fb = `<span class="cur-fb" style="background:rgba(0,0,0,0.3);border:1px solid ${esc(col)};color:${esc(col)};" title="${esc(name)}">${esc(abbr)}</span>`;
  if (url) {
    return `<img class="cur-img" src="${esc(url)}" alt="${esc(name)}" title="${esc(name)}" onerror="this.outerHTML=${JSON.stringify(fb)}">`;
  }
  return fb;
}

function profitStr(opp) {
  const p = budget * opp.abs;
  if (p >= 1000) return `~${(p/1000).toFixed(1)}kc`;
  if (p >= 1) return `~${Math.round(p)}c`;
  return `~${p.toFixed(3)}c`;
}

function render() {
  const list = document.getElementById('opp-list');
  const rows = opps();

  if (rows.length === 0) {
    const hasCat = DATA[version][category] && DATA[version][category].length > 0;
    list.innerHTML = `<div class="empty-state">
      <strong>${hasCat ? 'No results for this filter' : 'No data for this combination'}</strong>
      ${hasCat ? 'Try "All" in the Start filter.' : 'Switch version or category.'}
    </div>`;
    document.getElementById('s-opps').textContent = '0';
    document.getElementById('s-best').textContent = '—';
    return;
  }

  list.innerHTML = rows.map(opp => {
    const mc = opp.margin >= 5 ? 'green' : 'yellow';
    const pathLabel = opp.path.slice(0,-1).map(c => ABBR[c] || c.split(' ')[0]).join(' → ');
    const chain = opp.path.map((c,i) => (i>0 ? '<span class="chain-sep">›</span>' : '') + iconEl(c)).join('');

    return `<div class="opp-row" data-id="${esc(opp.id)}">
      <div class="row-main">
        <div>
          <div class="icon-chain">${chain}</div>
          <div class="row-sub">
            <span>${esc(pathLabel)}</span>
            ${opp.urgency === 'FAST' ? '<span class="badge-fast">FAST</span>' : ''}
            <span class="conf-dot ${opp.conf}"></span>
            <span>${opp.vol} vol</span>
            <span>${age(opp.spotted)}</span>
          </div>
        </div>
        <div class="row-margin ${mc}">+${opp.margin.toFixed(2)}%</div>
        <div class="row-profit">${profitStr(opp)}<br><small>/ ${Number(budget).toLocaleString()}c</small></div>
      </div>
      <div class="row-details" id="det-${esc(opp.id)}">
        <div class="det-rates">
          Buy: <span>${esc(opp.buy)}</span><br>
          Sell: <span>${esc(opp.sell)}</span>
        </div>
        <div class="det-meta">${opp.margin.toFixed(2)}% margin · abs ${opp.abs < 1 ? opp.abs.toFixed(4) : opp.abs.toFixed(1)}c · ${age(opp.spotted)}</div>
        <div class="det-actions">
          <button class="btn-w" data-id="${esc(opp.id)}">Copy Whisper</button>
          <button class="btn-l" data-id="${esc(opp.id)}">Log Flip</button>
        </div>
      </div>
    </div>`;
  }).join('');

  // row expand
  list.querySelectorAll('.row-main').forEach(rm => {
    rm.addEventListener('click', () => {
      const det = rm.nextElementSibling;
      det.classList.toggle('open');
    });
  });

  // copy whisper
  list.querySelectorAll('.btn-w').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const o = rows.find(x => x.id === btn.dataset.id);
      if (!o) return;
      navigator.clipboard.writeText(o.whisper).catch(()=>{});
      btn.textContent = 'Copied!'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy Whisper'; btn.classList.remove('copied'); }, 1500);
    });
  });

  // log flip
  list.querySelectorAll('.btn-l').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const o = rows.find(x => x.id === btn.dataset.id);
      if (!o) return;
      document.getElementById('modal-path').textContent = o.path.join(' → ');
      document.getElementById('modal-exp').value = (budget * o.abs).toFixed(2);
      document.getElementById('modal-act').value = (budget * o.abs).toFixed(2);
      document.getElementById('log-modal').classList.remove('hidden');
      document.getElementById('modal-act').focus();
    });
  });

  // stats
  const best = rows.reduce((m,o) => o.margin > m ? o.margin : m, 0);
  document.getElementById('s-opps').textContent =
    activeBase ? `${rows.length}/${(DATA[version][category]||[]).length}` : rows.length;
  document.getElementById('s-best').textContent = `+${best.toFixed(2)}%`;
}

function renderChips() {
  const all = DATA[version][category] || [];
  const bases = ['', ...new Set(all.map(o => o.base))];
  const bar = document.getElementById('base-chips');
  bar.innerHTML = bases.map(b =>
    `<button class="chip${activeBase===b?' active':''}" data-base="${esc(b)}">${esc(b)||'All'}</button>`
  ).join('');
  bar.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeBase = btn.dataset.base;
      renderChips(); render(); renderCalc();
    });
  });
}

function renderCalc() {
  const rows = opps();
  document.getElementById('calc-chips').innerHTML = rows.slice(0,5).map(o => {
    const p = budget * o.abs;
    const label = (ABBR[o.path[0]]||o.path[0].split(' ')[0])+'→'+(ABBR[o.path[o.path.length-2]]||o.path[o.path.length-2].split(' ')[0]);
    const val = p >= 1000 ? `${(p/1000).toFixed(1)}kc` : p >= 1 ? `${Math.round(p)}c` : `${p.toFixed(3)}c`;
    return `<span class="calc-chip">${label}: ~${val}</span>`;
  }).join('');
}

function updateCatCounts() {
  ['currency','fragment'].forEach(cat => {
    const el = document.getElementById('cnt-'+cat);
    if (el) el.textContent = (DATA[version][cat]||[]).length;
  });
}

function fullRefresh() {
  activeBase = '';
  updateCatCounts();
  renderChips();
  render();
  renderCalc();
}

// ── EVENTS ─────────────────────────────────────────────────────────────────

// version toggle
document.querySelectorAll('.vtoggle').forEach(btn => {
  btn.addEventListener('click', () => {
    version = btn.dataset.ver;
    document.querySelectorAll('.vtoggle').forEach(b => b.classList.toggle('active', b.dataset.ver === version));
    fullRefresh();
  });
});

// category tabs
document.querySelectorAll('.cat-tab:not(.soon)').forEach(tab => {
  tab.addEventListener('click', () => {
    category = tab.dataset.cat;
    document.querySelectorAll('.cat-tab:not(.soon)').forEach(t => t.classList.toggle('active', t.dataset.cat === category));
    activeBase = '';
    renderChips(); render(); renderCalc();
  });
});

// budget
document.getElementById('calc-budget').addEventListener('input', e => {
  budget = Math.max(1, parseInt(e.target.value) || 1000);
  render(); renderCalc();
});

// modal
document.getElementById('modal-cancel').addEventListener('click', () =>
  document.getElementById('log-modal').classList.add('hidden'));
document.getElementById('modal-confirm').addEventListener('click', () =>
  document.getElementById('log-modal').classList.add('hidden'));
document.getElementById('log-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.target.classList.add('hidden');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('log-modal').classList.add('hidden');
});

// clock + auto-refresh
function tick() {
  document.getElementById('htime').textContent = new Date().toTimeString().slice(0,8);
}
setInterval(tick, 1000); tick();
setInterval(render, 15000);

// init
fullRefresh();
</script>
