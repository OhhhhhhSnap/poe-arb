<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POE-ARB — Arbitrage Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #1c2128;
      --border: #30363d; --border-muted: #21262d;
      --gold: #d4a017; --green: #3fb950; --green-dim: #238636;
      --yellow: #d29922; --red: #f85149;
      --text: #e6edf3; --text-sec: #7d8590; --text-link: #58a6ff;
      --mono: 'JetBrains Mono', monospace; --sans: 'Inter', -apple-system, sans-serif;
    }
    html, body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }

    /* DEMO BANNER */
    .demo-banner { background: #2d1f00; border-bottom: 1px solid #6e4c00; padding: 0.4rem 1rem; font-family: var(--mono); font-size: 0.72rem; color: #f0a500; text-align: center; letter-spacing: 0.03em; }

    /* HEADER */
    .app-header { display: flex; align-items: center; gap: 0.75rem; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.6rem 1rem; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; }
    .app-logo { font-family: var(--mono); font-weight: 700; font-size: 1rem; color: var(--gold); letter-spacing: 0.12em; flex-shrink: 0; }
    .version-toggle { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .vtoggle { background: none; border: none; color: var(--text-sec); font-family: var(--mono); font-size: 0.72rem; padding: 0.25rem 0.6rem; cursor: pointer; transition: all 0.12s; }
    .vtoggle.active { background: var(--gold); color: #000; font-weight: 700; }
    .league-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: var(--sans); font-size: 0.78rem; padding: 0.28rem 0.5rem; border-radius: 6px; outline: none; flex: 1; min-width: 130px; max-width: 200px; }
    .header-spacer { flex: 1; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .header-time { font-family: var(--mono); font-size: 0.7rem; color: var(--text-sec); }

    /* STATS */
    .stats-bar { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
    .stat { flex: 1; padding: 0.55rem 0.5rem; text-align: center; border-right: 1px solid var(--border-muted); }
    .stat:last-child { border-right: none; }
    .stat-label { font-size: 0.6rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.08em; }
    .stat-val { font-family: var(--mono); font-size: 0.9rem; font-weight: 600; margin-top: 0.15rem; }

    /* FILTER BAR */
    .filter-bar { display: flex; align-items: center; gap: 0.5rem; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.4rem 1rem; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-label { font-size: 0.7rem; color: var(--text-sec); flex-shrink: 0; }
    .chip { font-family: var(--mono); font-size: 0.68rem; padding: 0.2rem 0.55rem; border: 1px solid var(--border); border-radius: 20px; background: none; color: var(--text-sec); cursor: pointer; transition: all 0.12s; white-space: nowrap; flex-shrink: 0; }
    .chip:hover { border-color: var(--gold); color: var(--gold); }
    .chip.active { border-color: var(--gold); color: var(--gold); background: rgba(212,160,23,0.1); }

    /* CALC */
    .calc-panel { background: var(--surface); border-bottom: 1px solid var(--border); }
    .calc-summary { display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 1rem; cursor: pointer; list-style: none; width: 100%; background: none; border: none; text-align: left; }
    .calc-summary::-webkit-details-marker { display: none; }
    .calc-caret { font-family: var(--mono); font-size: 0.65rem; color: var(--text-sec); transition: transform 0.15s; }
    details[open] .calc-caret { transform: rotate(90deg); }
    .calc-summary-label { font-size: 0.75rem; color: var(--text-sec); }
    .calc-body { padding: 0.5rem 1rem 0.8rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .calc-input-row { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; }
    .calc-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 0.78rem; padding: 0.28rem 0.45rem; border-radius: 6px; width: 90px; outline: none; }
    .calc-input:focus { border-color: var(--gold); }
    .calc-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; flex: 1; }
    .calc-result-chip { font-family: var(--mono); font-size: 0.68rem; color: var(--green); background: rgba(63,185,80,0.08); border: 1px solid rgba(63,185,80,0.2); border-radius: 4px; padding: 0.15rem 0.4rem; }

    /* LIST TABLE */
    .list-wrap { max-width: 900px; margin: 0 auto; }
    .list-header { display: grid; grid-template-columns: 1fr auto auto; gap: 1rem; padding: 0.45rem 1rem; font-size: 0.68rem; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.07em; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 53px; z-index: 50; }
    .lh-right { text-align: right; }

    .opp-row { border-bottom: 1px solid var(--border-muted); cursor: pointer; transition: background 0.1s; }
    .opp-row:hover { background: var(--surface); }
    .opp-row:active { background: var(--surface2); }

    .row-main { display: grid; grid-template-columns: 1fr auto auto; gap: 1rem; align-items: center; padding: 0.65rem 1rem; }

    /* Icon chain */
    .icon-chain { display: flex; align-items: center; gap: 2px; }
    .cur-img { width: 30px; height: 30px; object-fit: contain; flex-shrink: 0; }
    .cur-fallback { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 4px; font-family: var(--mono); font-size: 0.6rem; font-weight: 700; flex-shrink: 0; }
    .chain-sep { color: var(--text-sec); font-size: 0.55rem; padding: 0 1px; line-height: 30px; }

    .row-info { min-width: 0; }
    .row-name { font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 0.35rem; }
    .row-sub { font-family: var(--mono); font-size: 0.62rem; color: var(--text-sec); margin-top: 0.18rem; display: flex; gap: 0.5rem; align-items: center; }
    .badge-fast { font-size: 0.58rem; color: var(--yellow); border: 1px solid var(--yellow); border-radius: 3px; padding: 0.05rem 0.25rem; line-height: 1.4; flex-shrink: 0; }
    .conf-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .conf-dot.high { background: var(--green); }
    .conf-dot.medium { background: var(--yellow); }
    .conf-dot.low { background: var(--red); }

    .row-margin { font-family: var(--mono); font-weight: 700; font-size: 0.95rem; text-align: right; white-space: nowrap; }
    .row-margin.green { color: var(--green); }
    .row-margin.yellow { color: var(--yellow); }

    .row-profit { font-family: var(--mono); font-size: 0.75rem; color: var(--text-sec); text-align: right; white-space: nowrap; }
    .row-profit span { color: var(--green); }

    /* EXPANDED DETAILS */
    .row-details { display: none; padding: 0.1rem 1rem 0.85rem 1rem; border-top: 1px solid var(--border-muted); background: rgba(0,0,0,0.15); }
    .row-details.open { display: block; }
    .detail-rates { font-family: var(--mono); font-size: 0.73rem; color: var(--text-sec); margin-bottom: 0.5rem; line-height: 1.7; }
    .detail-rates span { color: var(--text); }
    .detail-meta { font-family: var(--mono); font-size: 0.68rem; color: var(--text-sec); margin-bottom: 0.6rem; }
    .detail-actions { display: flex; gap: 0.5rem; }
    .btn-whisper { flex: 1; font-family: var(--mono); font-size: 0.72rem; padding: 0.38rem 0.5rem; border-radius: 6px; cursor: pointer; border: 1px solid var(--gold); color: var(--gold); background: none; transition: all 0.12s; }
    .btn-whisper:hover, .btn-whisper.copied { background: var(--gold); color: #000; }
    .btn-log { flex: 1; font-family: var(--mono); font-size: 0.72rem; padding: 0.38rem 0.5rem; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); color: var(--text-sec); background: none; transition: all 0.12s; }
    .btn-log:hover { border-color: var(--green); color: var(--green); }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: flex-end; justify-content: center; z-index: 500; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px 12px 0 0; padding: 1.5rem; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 1rem; }
    .modal-title { font-family: var(--mono); font-weight: 700; color: var(--gold); font-size: 0.9rem; }
    .modal-path { font-family: var(--mono); font-size: 0.75rem; color: var(--text-sec); }
    .modal-label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.78rem; color: var(--text-sec); }
    .modal-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 0.88rem; padding: 0.4rem 0.6rem; border-radius: 6px; outline: none; width: 100%; }
    .modal-input:focus { border-color: var(--gold); }
    .modal-input[readonly] { color: var(--text-sec); }
    .modal-actions { display: flex; gap: 0.6rem; justify-content: flex-end; }
    .modal-cancel { background: none; border: 1px solid var(--border); color: var(--text-sec); font-family: var(--mono); font-size: 0.75rem; padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; }
    .modal-confirm { background: var(--gold); border: 1px solid var(--gold); color: #000; font-family: var(--mono); font-size: 0.75rem; font-weight: 700; padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; }
    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .list-header { grid-template-columns: 1fr auto; }
      .lh-profit { display: none; }
      .row-main { grid-template-columns: 1fr auto; }
      .row-profit { display: none; }
    }
  </style>
</head>
<body>

<div class="demo-banner">⚡ DEMO MODE — mock data · connect to poe.ninja for live arbitrage</div>

<header class="app-header">
  <span class="app-logo">POE-ARB</span>
  <div class="version-toggle">
    <button class="vtoggle active">PoE2</button>
    <button class="vtoggle">PoE1</button>
  </div>
  <select class="league-select">
    <option>Fate of the Vaal</option>
    <option>Standard</option>
  </select>
  <div class="header-spacer"></div>
  <span class="live-dot"></span>
  <span class="header-time" id="header-time">--:--:--</span>
</header>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-label">Opportunities</div>
    <div class="stat-val" id="stat-opps">8</div>
  </div>
  <div class="stat">
    <div class="stat-label">Best Margin</div>
    <div class="stat-val" style="color:var(--green)" id="stat-best">+9.20%</div>
  </div>
  <div class="stat">
    <div class="stat-label">Session Profit</div>
    <div class="stat-val" id="stat-session">+8.2c</div>
  </div>
  <div class="stat">
    <div class="stat-label">Data Age</div>
    <div class="stat-val" id="stat-age">18s</div>
  </div>
</div>

<div class="filter-bar">
  <span class="filter-label">Start:</span>
  <div id="base-chips" style="display:contents"></div>
</div>

<details class="calc-panel">
  <summary class="calc-summary">
    <span class="calc-caret">▶</span>
    <span class="calc-summary-label">Profit Calculator</span>
  </summary>
  <div class="calc-body">
    <div class="calc-input-row">
      Budget <input id="calc-budget" type="number" value="5000" class="calc-input"> Chaos
    </div>
    <div class="calc-chips" id="calc-chips"></div>
  </div>
</details>

<div class="list-wrap">
  <div class="list-header">
    <div>Arbitrage Path</div>
    <div class="lh-right">Margin</div>
    <div class="lh-right lh-profit">Profit / Budget</div>
  </div>
  <div id="opp-list"></div>
</div>

<!-- LOG FLIP MODAL -->
<div id="log-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-title">Log Completed Flip</div>
    <div class="modal-path" id="modal-path"></div>
    <label class="modal-label">Expected Profit (c)
      <input type="number" id="modal-exp" class="modal-input" readonly>
    </label>
    <label class="modal-label">Actual Profit (c)
      <input type="number" id="modal-act" class="modal-input" step="0.1">
    </label>
    <div class="modal-actions">
      <button class="modal-cancel" id="modal-cancel">Cancel</button>
      <button class="modal-confirm" id="modal-confirm">Log Flip</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ── CURRENCY ICONS (poe cdn) ───────────────────────────────────────────────
const CDN = 'https://web.poecdn.com/image/Art/2DItems/Currency/';
const ICON_URL = {
  'Chaos Orb':        CDN + 'CurrencyRerollRare.png',
  'Divine Orb':       CDN + 'CurrencyModValues.png',
  'Exalted Orb':      CDN + 'CurrencyAddModToRare.png',
  'Orb of Alchemy':   CDN + 'CurrencyUpgradeToRare.png',
  'Orb of Alteration':CDN + 'CurrencyRerollMagic.png',
  'Mirror of Kalandra':CDN + 'CurrencyDuplicate.png',
};
const FALLBACK_COLOR = {
  'Chaos Orb':'#c8a84b','Divine Orb':'#00e676','Exalted Orb':'#9c6fff',
  'Orb of Alchemy':'#ff8f00','Orb of Alteration':'#4fc3f7',
};
const ABBR = {
  'Chaos Orb':'C','Divine Orb':'D','Exalted Orb':'Ex',
  'Orb of Alchemy':'Al','Orb of Alteration':'Alt',
};

// ── MOCK DATA ──────────────────────────────────────────────────────────────
const OPPS = [
  { id:'c|al|c', base:'Chaos Orb',
    path:['Chaos Orb','Orb of Alchemy','Chaos Orb'],
    margin:9.20, abs:0.092, vol:311, conf:'high', urgency:'',
    buy:'1 Chaos Orb = 14 Orb of Alchemy',
    sell:'1 Orb of Alchemy = 0.078 Chaos Orb',
    profit:'9.200% per Chaos Orb cycled',
    spotted: Date.now()-90000,
    whisper:'@whisper Hi, I\'d like to buy your 14 Orb of Alchemy for my 1 Chaos Orb in Fate of the Vaal.' },
  { id:'c|d|ex|c', base:'Chaos Orb',
    path:['Chaos Orb','Divine Orb','Exalted Orb','Chaos Orb'],
    margin:7.42, abs:0.0742, vol:142, conf:'high', urgency:'FAST',
    buy:'1 Chaos Orb = 0.0000198 Divine Orb',
    sell:'1 Exalted Orb = 0.155 Chaos Orb',
    profit:'7.420% per Chaos Orb cycled',
    spotted: Date.now()-45000,
    whisper:'@whisper Hi, I\'d like to buy your 1 Divine Orb for my 50505 Chaos Orb in Fate of the Vaal.' },
  { id:'d|ex|al|d', base:'Divine Orb',
    path:['Divine Orb','Exalted Orb','Orb of Alchemy','Divine Orb'],
    margin:6.81, abs:3483.5, vol:88, conf:'high', urgency:'FAST',
    buy:'1 Divine Orb = 363636 Exalted Orb',
    sell:'1 Orb of Alchemy = 0.078 Chaos Orb',
    profit:'6.810% per Divine Orb cycled',
    spotted: Date.now()-22000,
    whisper:'@whisper Hi, I\'d like to buy your 363636 Exalted Orb for my 1 Divine Orb in Fate of the Vaal.' },
  { id:'ex|al|alt|ex', base:'Exalted Orb',
    path:['Exalted Orb','Orb of Alchemy','Orb of Alteration','Exalted Orb'],
    margin:5.14, abs:0.0203, vol:57, conf:'medium', urgency:'FAST',
    buy:'1 Exalted Orb = 0.561 Orb of Alchemy',
    sell:'1 Orb of Alteration = 0.042 Chaos Orb',
    profit:'5.140% per Exalted Orb cycled',
    spotted: Date.now()-12000,
    whisper:'@whisper Hi, I\'d like to buy your 1 Orb of Alchemy for my 2 Exalted Orb in Fate of the Vaal.' },
  { id:'c|alt|al|c', base:'Chaos Orb',
    path:['Chaos Orb','Orb of Alteration','Orb of Alchemy','Chaos Orb'],
    margin:4.58, abs:0.0458, vol:209, conf:'medium', urgency:'',
    buy:'1 Chaos Orb = 28 Orb of Alteration',
    sell:'1 Orb of Alchemy = 0.078 Chaos Orb',
    profit:'4.580% per Chaos Orb cycled',
    spotted: Date.now()-300000,
    whisper:'@whisper Hi, I\'d like to buy your 28 Orb of Alteration for my 1 Chaos Orb in Fate of the Vaal.' },
  { id:'d|al|d', base:'Divine Orb',
    path:['Divine Orb','Orb of Alchemy','Divine Orb'],
    margin:3.88, abs:1981.4, vol:162, conf:'high', urgency:'',
    buy:'1 Divine Orb = 714.3 Orb of Alchemy',
    sell:'1 Orb of Alchemy = 0.078 Chaos Orb',
    profit:'3.880% per Divine Orb cycled',
    spotted: Date.now()-420000,
    whisper:'@whisper Hi, I\'d like to buy your 714 Orb of Alchemy for my 1 Divine Orb in Fate of the Vaal.' },
  { id:'c|d|c', base:'Chaos Orb',
    path:['Chaos Orb','Divine Orb','Chaos Orb'],
    margin:3.67, abs:0.0367, vol:382, conf:'high', urgency:'',
    buy:'1 Chaos Orb = 0.0000198 Divine Orb',
    sell:'1 Divine Orb = 52360 Chaos Orb',
    profit:'3.670% per Chaos Orb cycled',
    spotted: Date.now()-180000,
    whisper:'@whisper Hi, I\'d like to buy your 1 Divine Orb for my 50505 Chaos Orb in Fate of the Vaal.' },
  { id:'c|d|alt|al|c', base:'Chaos Orb',
    path:['Chaos Orb','Divine Orb','Orb of Alteration','Orb of Alchemy','Chaos Orb'],
    margin:3.21, abs:0.0321, vol:38, conf:'low', urgency:'FAST',
    buy:'1 Chaos Orb = 0.0000198 Divine Orb',
    sell:'1 Orb of Alchemy = 0.078 Chaos Orb',
    profit:'3.210% per Chaos Orb cycled',
    spotted: Date.now()-8000,
    whisper:'@whisper Hi, I\'d like to buy your 1 Divine Orb for my 50505 Chaos Orb in Fate of the Vaal.' },
];

// ── STATE ──────────────────────────────────────────────────────────────────
let activeBase = '';
let budget = 5000;

function visible() {
  return activeBase ? OPPS.filter(o => o.base === activeBase) : OPPS;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeSince(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return Math.floor(s) + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  return Math.floor(s/3600) + 'h ago';
}

function iconEl(name) {
  const url = ICON_URL[name];
  const col = FALLBACK_COLOR[name] || '#7d8590';
  const abbr = ABBR[name] || name[0];
  if (url) {
    return `<img class="cur-img" src="${esc(url)}" alt="${esc(name)}" title="${esc(name)}"
      onerror="this.outerHTML='<span class=\\'cur-fallback\\' style=\\'background:rgba(125,133,144,0.15);border:1px solid ${col};color:${col};\\'>${abbr}</span>'">`; 
  }
  return `<span class="cur-fallback" style="background:rgba(125,133,144,0.15);border:1px solid ${col};color:${col};">${abbr}</span>`;
}

function chainHtml(path) {
  return path.map((c,i) =>
    (i > 0 ? '<span class="chain-sep">›</span>' : '') + iconEl(c)
  ).join('');
}

function profitLabel(opp) {
  const p = budget * opp.abs;
  if (p >= 1000) return `~${(p/1000).toFixed(1)}k c`;
  if (p >= 1) return `~${p.toFixed(0)}c`;
  return `~${p.toFixed(3)}c`;
}

function renderList() {
  const list = document.getElementById('opp-list');
  const opps = visible();

  list.innerHTML = opps.map(opp => {
    const mc = opp.margin >= 5 ? 'green' : 'yellow';
    const pathLabel = opp.path.slice(0,-1).map(c => ABBR[c]||c.split(' ')[0]).join(' → ');

    return `<div class="opp-row" data-id="${esc(opp.id)}">
      <div class="row-main">
        <div class="row-info">
          <div class="row-name">
            <div class="icon-chain">${chainHtml(opp.path)}</div>
          </div>
          <div class="row-sub">
            <span>${esc(pathLabel)}</span>
            ${opp.urgency ? `<span class="badge-fast">${esc(opp.urgency)}</span>` : ''}
            <span class="conf-dot ${opp.conf}"></span>
            <span>${opp.vol} vol</span>
            <span>${timeSince(opp.spotted)}</span>
          </div>
        </div>
        <div class="row-margin ${mc}">+${opp.margin.toFixed(2)}%</div>
        <div class="row-profit">${profitLabel(opp)}<br><span style="color:var(--text-sec);font-size:0.6rem">/ ${budget.toLocaleString()}c</span></div>
      </div>
      <div class="row-details" id="det-${esc(opp.id)}">
        <div class="detail-rates">
          Buy: <span>${esc(opp.buy)}</span><br>
          Sell: <span>${esc(opp.sell)}</span>
        </div>
        <div class="detail-meta">${esc(opp.profit)} · abs ${opp.abs < 1 ? opp.abs.toFixed(4) : opp.abs.toFixed(1)}c</div>
        <div class="detail-actions">
          <button class="btn-whisper" data-id="${esc(opp.id)}">Copy Whisper</button>
          <button class="btn-log" data-id="${esc(opp.id)}">Log Flip</button>
        </div>
      </div>
    </div>`;
  }).join('');

  // row toggle
  list.querySelectorAll('.opp-row').forEach(row => {
    row.querySelector('.row-main').addEventListener('click', () => {
      const det = row.querySelector('.row-details');
      det.classList.toggle('open');
    });
  });

  // copy whisper
  list.querySelectorAll('.btn-whisper').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const opp = OPPS.find(o => o.id === btn.dataset.id);
      if (!opp) return;
      navigator.clipboard.writeText(opp.whisper).catch(()=>{});
      btn.textContent = 'Copied!'; btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy Whisper'; btn.classList.remove('copied'); }, 1500);
    });
  });

  // log flip
  list.querySelectorAll('.btn-log').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const opp = OPPS.find(o => o.id === btn.dataset.id);
      if (!opp) return;
      document.getElementById('modal-path').textContent = opp.path.join(' → ');
      document.getElementById('modal-exp').value = (budget * opp.abs).toFixed(2);
      document.getElementById('modal-act').value = (budget * opp.abs).toFixed(2);
      document.getElementById('log-modal').classList.remove('hidden');
      document.getElementById('modal-act').focus();
    });
  });

  // update stat
  document.getElementById('stat-opps').textContent =
    activeBase ? `${opps.length} / ${OPPS.length}` : OPPS.length;

  const best = opps.reduce((mx, o) => o.margin > mx ? o.margin : mx, 0);
  document.getElementById('stat-best').textContent = opps.length ? `+${best.toFixed(2)}%` : '—';
}

function renderChips() {
  const bar = document.getElementById('base-chips');
  const bases = ['', ...new Set(OPPS.map(o => o.base))];
  bar.innerHTML = bases.map(b =>
    `<button class="chip${activeBase===b?' active':''}" data-base="${esc(b)}">${b||'All'}</button>`
  ).join('');
  bar.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeBase = btn.dataset.base;
      renderChips();
      renderList();
      renderCalc();
    });
  });
}

function renderCalc() {
  const opps = visible();
  document.getElementById('calc-chips').innerHTML = opps.slice(0,5).map(o => {
    const p = budget * o.abs;
    const label = (ABBR[o.path[0]]||o.path[0].split(' ')[0]) + '→' + (ABBR[o.path[o.path.length-2]]||o.path[o.path.length-2].split(' ')[0]);
    const val = p >= 1000 ? `${(p/1000).toFixed(1)}kc` : p >= 1 ? `${p.toFixed(0)}c` : `${p.toFixed(3)}c`;
    return `<span class="calc-result-chip">${label}: ~${val}</span>`;
  }).join('');
}

// clock
function tick() {
  const now = new Date();
  document.getElementById('header-time').textContent =
    now.toTimeString().slice(0,8);
}
setInterval(tick, 1000); tick();
setInterval(renderList, 15000);

// budget input
document.getElementById('calc-budget').addEventListener('input', e => {
  budget = Math.max(1, parseInt(e.target.value) || 1000);
  renderList();
  renderCalc();
});

// modal
document.getElementById('modal-cancel').addEventListener('click', () =>
  document.getElementById('log-modal').classList.add('hidden'));
document.getElementById('modal-confirm').addEventListener('click', () =>
  document.getElementById('log-modal').classList.add('hidden'));
document.getElementById('log-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.target.classList.add('hidden');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('log-modal').classList.add('hidden');
});

// init
renderChips();
renderList();
renderCalc();
</script>
</body>
</html>
