name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build backend exe with PyInstaller
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller poe-arb.spec
        # Produces dist/poe-arb-server.exe

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Electron installer
        run: |
          cd overlay
          npm ci
          npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # electron-builder picks up dist/poe-arb-server.exe via extraResources

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: poe-arb-windows-installer
          path: overlay/dist/*.exe
          retention-days: 30

      - name: Publish GitHub release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: overlay/dist/*.exe
          generate_release_notes: true
